<style>
:root{--gold:#C9A24D;--ink:#111;--cream:#F7F4EC;--dark-text:#D9D4C7}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--ink);color:var(--cream);font-family:Inter,Arial,sans-serif;display:flex;flex-direction:column}
main{flex:1;width:100%;max-width:1040px;margin:0 auto;padding:56px 40px 64px;display:flex;flex-direction:column;align-items:center;gap:28px;text-align:center}
.logo{width:76px;height:76px;display:block}
.kicker{font-family:Cinzel,Georgia,serif;font-weight:700;font-size:14px;letter-spacing:5px;color:var(--gold)}
h1{margin:0;font-family:Cinzel,Georgia,serif;font-weight:700;font-size:44px;line-height:1.12}
.video{position:relative;width:100%;max-width:760px;aspect-ratio:16/9;background:#1E1D1A;border-radius:14px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.45);margin-top:8px}
.video .ply-start{all:unset;position:absolute;inset:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.video .thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.6;transition:opacity .2s}
.video .ply-start:hover .thumb,.video .ply-start:focus-visible .thumb{opacity:.75}
.video .play{position:relative;width:84px;height:84px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;padding-left:4px;transition:transform .2s}
.video .ply-start:hover .play{transform:scale(1.06)}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
footer{border-top:1px solid #3A362F;padding:24px 16px 28px;text-align:center;font-size:14px;color:var(--dark-text)}
footer span{display:block;font-family:Cinzel,Georgia,serif;font-weight:700;letter-spacing:6px;color:var(--cream);font-size:16px;margin-bottom:6px}
@media (max-width:760px){
  main{padding:36px 16px 44px;gap:20px}
  .logo{width:60px;height:60px}
  h1{font-size:28px}
  .video .play{width:64px;height:64px}
}
</style>
</head>
<body>
<main>
  <img class="logo" src="assets/logo.png" alt="Les Stratèges">
  <div class="kicker">LES STRATÈGES</div>
  <h1>Les 6 piliers d'un dossier admis</h1>
  <div class="video" data-yt="IOaZ134qCHU" data-tag="Les 6 piliers d'un dossier admis" data-no-tag></div>
</main>
<footer><span>LES STRATÈGES</span>Une question ? Contactez votre chargé d'admission.</footer>
<script src="assets/player.js"></script>
</body>
</html>
